<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>NP2_001 逐序实体去料</title>
<style>body{font:15px system-ui;margin:20px;background:#f4f6f8;color:#243746}select,button{padding:7px;margin:4px}main{display:flex;gap:16px}section{background:white;border:1px solid #ccd3dc;width:50%;position:relative}canvas{width:100%;height:560px;display:block}h2{margin:12px;font-size:18px}#overlay{position:absolute;left:0;bottom:0}p{line-height:1.6}.warn{color:#884719}#details{white-space:pre-wrap}</style>
<h1>NP2_001 · 逐序实体去料子集</h1>
<p class="warn">仅纳入二维完整轮廓与 CAD 内环唯一吻合的普通冲孔。外边界仍来自成品；预孔、切边、局部成形及同序去料过程尚未建模。不能据此判定候选成功或失败。</p>
<label>工序 <select id="station"></select></label><label>状态 <select id="phase"><option value="entry">进入态：仅此前完成孔</option><option value="completed">完成态：包含本序完成孔</option></select></label>
<label>视角 <select id="view"><option value="iso">立体</option><option value="top">俯视</option></select></label><button id="fit">适应视图</button><p id="status"></p>
<main><section><h2>二维 · 已完成去料轮廓</h2><canvas id="flat"></canvas></section><section><h2>三维 · 检测实体网格</h2><canvas id="scene"></canvas><canvas id="overlay"></canvas></section></main>
<p>三维拖动旋转，滚轮缩放。蓝色轮廓标记本子集已去料的孔，孔内为空缺材料。二维只显示本子集，不代表完整料片。</p><p id="details"></p>
<script id="data" type="application/json">/*__DATA__*/</script><script>/*__CORE__*/</script><script>/*__MOTION__*/</script><script>/*__RENDERER__*/</script>
<script>
'use strict';const $=id=>document.getElementById(id),d=JSON.parse($('data').textContent),C=IE3DCore,M=MaterialMotion;
const renderer=new MotionRenderer($('scene')),camera={yaw:-1.05,pitch:.55,center:[0,0,0],pan:[0,0],scale:1};let geometry,selected;
for(const s of d.stations){const o=document.createElement('option');o.value=s.station_id;o.textContent=s.station_id;$('station').append(o)}
function build(){selected=d.states.find(s=>s.station_id===$('station').value&&s.phase===$('phase').value);const ts=Object.fromEntries(Object.entries(d.poses[selected.station_id][selected.phase]).map(([r,m])=>[r,m.flat()]));geometry={triangles:[],points:[],ts};for(const p of d.meshes[selected.material_id])for(const t of p.triangles){const points=t.map(v=>M.point(ts[p.region_id],v));geometry.triangles.push({region:0,points});if(points.flat().some(v=>!Number.isFinite(v)))throw Error('Invalid transformed geometry');geometry.points.push(...points)}}
function draw(){renderer.render(geometry.triangles,[],[],camera,[[190,204,215]]);const canvas=$('overlay'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);const active=d.operations.filter(o=>selected.removed_operation_ids.includes(o.operation_id));ctx.strokeStyle='#1575b9';ctx.lineWidth=1.5;
for(const op of active)for(const path of op.formed_paths){ctx.beginPath();path.forEach((p,i)=>{const q=C.project(M.point(geometry.ts[op.region_id],p),camera,canvas.width,canvas.height);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke()}
const fc=$('flat'),f=fc.getContext('2d');f.clearRect(0,0,fc.width,fc.height);const all=d.operations.flatMap(o=>o.flat_paths.flat());const lo=[0,1].map(i=>Math.min(...all.map(p=>p[i]))),hi=[0,1].map(i=>Math.max(...all.map(p=>p[i]))),scale=.9*Math.min(fc.width/(hi[0]-lo[0]),fc.height/(hi[1]-lo[1]));f.strokeStyle='#1575b9';f.lineWidth=2;for(const op of active)for(const path of op.flat_paths){f.beginPath();path.forEach((p,i)=>{const q=[fc.width/2+(p[0]-(lo[0]+hi[0])/2)*scale,fc.height/2-(p[1]-(lo[1]+hi[1])/2)*scale];i?f.lineTo(...q):f.moveTo(...q)});f.stroke()}
$('status').textContent=`${selected.station_id} ${selected.phase==='entry'?'进入态':'完成态'} · ${active.length} 个已切孔 · 板体总体积 ${selected.volume_mm3.toFixed(3)} mm³ · ${selected.material_id}`;$('details').textContent='已真实去料动作：'+(selected.removed_operation_ids.join('、')||'无');window.removalReview={data:d,state:selected,triangleCount:geometry.triangles.length};}
function fit(){build();const ps=geometry.points,lo=[0,1,2].map(i=>Math.min(...ps.map(p=>p[i]))),hi=[0,1,2].map(i=>Math.max(...ps.map(p=>p[i])));camera.center=lo.map((v,i)=>(v+hi[i])/2);camera.pan=[0,0];camera.scale=.8*Math.min($('scene').width,$('scene').height)/Math.max(...hi.map((v,i)=>v-lo[i]));draw()}
function resize(){for(const id of ['flat','scene','overlay']){const c=$(id);c.width=Math.round(c.clientWidth*devicePixelRatio);c.height=Math.round(c.clientHeight*devicePixelRatio)}fit()}
$('station').onchange=$('phase').onchange=()=>{build();draw()};$('fit').onclick=fit;$('view').onchange=()=>{[camera.yaw,camera.pitch]=$('view').value==='top'?[-Math.PI/2,Math.PI/2]:[-1.05,.55];fit()};let drag=null;$('overlay').onpointerdown=e=>{drag=[e.clientX,e.clientY];e.target.setPointerCapture(e.pointerId)};$('overlay').onpointermove=e=>{if(!drag)return;camera.yaw-=(e.clientX-drag[0])*.006;camera.pitch=Math.max(-1.56,Math.min(1.56,camera.pitch+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];draw()};$('overlay').onpointerup=$('overlay').onpointercancel=()=>drag=null;$('overlay').onwheel=e=>{e.preventDefault();camera.scale*=Math.exp(-e.deltaY*.001);draw()};window.addEventListener('resize',resize);resize();
</script></html>
