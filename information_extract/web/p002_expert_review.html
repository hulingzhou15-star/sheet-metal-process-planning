<!doctype html><html lang="zh"><meta charset="utf-8"><title>P002 · 专家工序提取审核</title>
<style>body{font:16px system-ui;color:#263d50;background:#f3f6fa;margin:24px}select,button{font:inherit;padding:8px;margin:4px}table{border-collapse:collapse;background:white;width:100%}td,th{border:1px solid #d4dee8;padding:8px;text-align:left}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.panel{padding:16px;background:white;border:1px solid #ccd6df;border-radius:8px}svg{width:100%;height:450px;background:#22272e}aside{padding:14px;background:#fff0cf}h2{font-size:20px}a{color:#1669b1}</style>
<h1>P002 · 从专家工序图提取动作分配</h1><p>对应 P002_1 已标注的动作；合并前记录保留追溯，已退出分配的记录单独标示。保留专家图原色。镜像仅用于坐标对齐，不改变材料侧别。原工作簿未改写。</p>
<aside id="summary"></aside><p><select id="filter"><option value="pending">待核项</option><option value="all">全部动作</option></select><select id="op"></select><select id="frame"></select><button id="local">局部对照</button><button id="whole">整件对照</button></p>
<div class="views"><section class="panel"><h2 id="leftTitle"></h2><svg id="flat"></svg><p>白色：已绑定的二维特征；灰色：展开图背景。</p></section><section class="panel"><h2 id="rightTitle"></h2><svg id="expert"></svg><p>专家图原色；虚线框为所选动作的展开位置，仅供定位。</p></section></div>
<div id="detail"></div><aside id="diagnostics"></aside><p><a href="assignments_draft.json">动作分配与未决项 JSON</a> · <a href="evidence.json">原坐标、颜色和逐段来源证据</a></p>
<script>
const DATA=__DATA__, $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={USER_CONFIRMED_GEOMETRY_VARIANT:'已指认对应孔（圆角有差异）',USER_CONFIRMED_SINGLE_STAGE:'用户确认单工序',UNIQUE_FULL_HIGHLIGHT:'全轮廓唯一高亮',MULTIPLE_STATION_HIGHLIGHTS:'多个工序高亮',PARTIAL_HIGHLIGHT:'局部高亮',NO_HIGHLIGHT_MATCH:'未找到高亮'};let whole=false;
$('summary').textContent=Object.entries(DATA.summary.counts).map(([k,v])=>`${labels[k]}：${v}`).join('；')+`。已明确工序 ${DATA.summary.resolved_count}/${DATA.summary.allocation_count}（共 ${DATA.summary.record_count} 条记录）；拉包按用户确认仅在 OP10 加工，原色证据保留。另有 `+DATA.summary.cad_parent_order_diagnostics.length+' 项 CAD 父子先后冲突、'+DATA.summary.not_later_order_diagnostics.length+' 项不晚于约束冲突。原专家图示分配保留。';
$('frame').innerHTML=DATA.frames.map(f=>`<option value="${f.frame_id}">${esc(f.text)}${f.ancillary?'（附加视图，不纳入正式分配）':''}</option>`).join('');
$('diagnostics').textContent='提取后单独核查：'+DATA.summary.cad_parent_order_diagnostics.map(d=>`${d.child}（${d.child_station}）→ ${d.parent}（${d.parent_station}），与已记录的严格先后不一致，需核查原标注/工艺含义。`).join(' ')+' 不晚于约束：'+DATA.summary.not_later_order_diagnostics.map(d=>`${d.operation_id}（${d.operation_station}）≤ ${d.not_later_than}（${d.target_station}），允许同序，当前图示分配不满足。`).join(' ')+' 没有用这些关系反推或修改工序。 工序能力核查：'+DATA.summary.relation_capacity_issues.join(' ');
function shape(s){const p=s.points;if(s.kind==='CIRCLE')return `<circle cx="${p[0][0]}" cy="${-p[0][1]}" r="${s.radius}"/>`;if(s.kind==='ARC'){const a=p[0],b=p[1],c=p[2],dot=(a[0]-c[0])*(b[0]-c[0])+(a[1]-c[1])*(b[1]-c[1]),cross=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);return `<path d="M ${a[0]} ${-a[1]} A ${s.radius} ${s.radius} 0 ${dot>0?1:0} ${cross>0?1:0} ${b[0]} ${-b[1]}"/>`;}return `<path d="M ${p[0][0]} ${-p[0][1]} L ${p[1][0]} ${-p[1][1]}"/>`;}
function bbox(rows){const pts=rows.flatMap(s=>s.kind==='CIRCLE'?[[s.points[0][0]-s.radius,s.points[0][1]-s.radius],[s.points[0][0]+s.radius,s.points[0][1]+s.radius]]:s.points);return [Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]}
function operation(){return DATA.summary.operations.find(o=>o.operation_id===$('op').value)}
function populate(){const rows=DATA.summary.operations.filter(o=>$('filter').value==='all'||(o.allocation_included&&!o.proposed_expert_station));$('op').innerHTML=rows.map(o=>`<option value="${o.operation_id}">${o.operation_id} · ${esc(o.name)} · ${o.superseded_by_operation_id?`已合并到 ${o.superseded_by_operation_id}，不分配`:labels[o.status]}</option>`).join('');selectOperation()}
function selectOperation(){const o=operation();if(!o){$('detail').textContent='当前没有工序分配待核项，可切换全部动作查看；关系诊断见下方。';for(const id of ['flat','expert'])$(id).replaceChildren();$('leftTitle').textContent='无待核动作';$('rightTitle').textContent='';return;}const e=o.evidence.find(e=>e.station_id===o.proposed_expert_station)||o.evidence.find(e=>e.highlighted_source_count)||o.evidence.find(e=>e.matched_source_count);if(e)$('frame').value=e.frame_id;render()}
function render(){if(!operation())return;const o=operation(),f=DATA.frames.find(f=>f.frame_id===$('frame').value),ids=new Set(o.source_segment_ids),selected=DATA.flat_primitives.filter(s=>ids.has(s.source_id)),b=bbox(whole?DATA.flat_primitives:selected),a=bbox(selected),pad=Math.max(b[2]-b[0],b[3]-b[1],1)*.22;
 for(const id of ['flat','expert'])$(id).setAttribute('viewBox',`${b[0]-pad} ${-b[3]-pad} ${b[2]-b[0]+2*pad} ${b[3]-b[1]+2*pad}`);
 $('flat').innerHTML=DATA.flat_primitives.map(s=>`<g fill="none" stroke="${ids.has(s.source_id)?'#fff':'#636e79'}" stroke-width="${ids.has(s.source_id)?1.3:.7}">${shape(s)}</g>`).join('');
 $('expert').innerHTML=f.targets.map(s=>`<g fill="none" stroke="${s.color}" stroke-width="1">${shape(s)}</g>`).join('')+`<rect x="${a[0]-.7}" y="${-a[3]-.7}" width="${a[2]-a[0]+1.4}" height="${a[3]-a[1]+1.4}" fill="none" stroke="#a7d8ff" stroke-width=".7" stroke-dasharray="3 3"/>`;
 document.querySelectorAll('svg path,svg circle,svg rect').forEach(e=>e.setAttribute('vector-effect','non-scaling-stroke'));
 $('leftTitle').textContent=`${o.operation_id} · ${o.name}`;$('rightTitle').textContent=f.text;
 $('detail').innerHTML=`<h2>${o.superseded_by_operation_id?`已合并到 ${o.superseded_by_operation_id}，不参与分配 · 原图证据：`:""}${labels[o.status]}${o.proposed_expert_station?' · 提取建议 '+o.proposed_expert_station:''}</h2>${o.user_decision_id?`<p>用户确认：${esc(o.basis)}。原始图示证据保留，按本项确认记录分配。</p>`:''}${o.composite_policy==='INTEGRATED_DRAW_FORM'?`<p>拉包组成孔：${o.composite_operation_ids.join('、')}，不再独立分配，按用户确认随拉包归OP10。下表保留原图：拉包主轮廓在OP10，两孔在OP40高亮，不将原图证据改写为同序。</p>`:''}${o.geometry_variant_audit?`<p>位置与尺寸一致：5 × 5 mm；展开圆角 R${o.geometry_variant_audit.flat_radii_mm[0].toFixed(5)}，OP20 圆角 R${o.geometry_variant_audit.expert_radii_mm[0].toFixed(5)}。下表保留严格逐段匹配计数，不把尺寸有差异的孔伪记为全段匹配。</p>`:''}<table><tr><th>工序</th><th>严格几何匹配</th><th>高亮匹配</th><th>高亮原色</th></tr>`+o.evidence.map(e=>`<tr><td><button data-frame="${e.frame_id}">${e.station_id}</button></td><td>${e.matched_source_count}/${o.source_count}</td><td>${e.highlighted_source_count}/${o.source_count}</td><td>${Object.keys(e.colors).map(c=>`<span style="background:${c};display:inline-block;width:16px;height:16px;border:1px solid #aaa"></span> ${c}`).join(' ')}</td></tr>`).join('')+'</table>';
 $('detail').querySelectorAll('button').forEach(e=>e.onclick=()=>{$('frame').value=e.dataset.frame;render()});
}
$('filter').onchange=populate;$('op').onchange=selectOperation;$('frame').onchange=render;$('local').onclick=()=>{whole=false;render()};$('whole').onclick=()=>{whole=true;render()};populate();
</script></html>
